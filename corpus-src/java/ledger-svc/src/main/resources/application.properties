# ledger-svc runtime settings.
#
# The crypto block decides what the service builds at startup; no algorithm is
# hard-coded in App.java.

ledger.node-name=lg-eu-central-1
ledger.listen=127.0.0.1:8710
ledger.store=sealed-memory
ledger.segment-bytes=1048576

ledger.crypto.segment-cipher=AES-256-GCM #@PS java-l4-prop-cipher|AES-256-GCM|4|algorithm|segment AEAD selected by config
ledger.crypto.block-signature=Ed25519 #@PS java-l4-prop-sig|Ed25519|4|algorithm|block signature selected by config
ledger.crypto.replication-key-agreement=ML-KEM-768 #@PS java-l4-prop-kem|ML-KEM-768|4|algorithm|replication key agreement selected by config
ledger.crypto.settlement-signature=SHA256withRSA #@PS java-l4-prop-settlement|RSA-2048|4|algorithm|settlement export signature selected by config
ledger.crypto.audit-seal=XMSS-SHA2_10_256 #@PS java-l4-prop-audit-seal|XMSS|4|algorithm|audit seal parameter set selected by config
ledger.crypto.keystore=keys/ledger-node.p12

ledger.index.fingerprint-hash=SHA-256 #@PS java-l4-prop-hash|SHA-256|4|algorithm|ledger index fingerprint hash selected by config
ledger.index.retain-days=2555
