[package]
name = "sealbox"
version = "0.7.2"
edition = "2021"
rust-version = "1.74"
description = "Encrypted blob store node"
license = "Apache-2.0"

[dependencies]
aes-gcm = "=0.10.3"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
fips203 = "=0.4.3"
# Evaluated for manifest signatures; the default build still signs with
# ed25519-dalek. Declared so the migration branch resolves the same lockfile.
ml-dsa = "=0.0.4" #@PS rust-dep-mldsa|ML-DSA|5|algorithm|declared RustCrypto ML-DSA dependency; not reached by the default build
p256 = { version = "=0.13.2", features = ["ecdsa"] }
rand = "=0.8.5"
rsa = "=0.9.10"
sha2 = "=0.10.8"

# Reachable only from the `legacy-import` binary, which is built by the
# migration image and not by the default workspace target.
chacha20poly1305 = "=0.10.1" #@PS rust-dep-chacha|chacha20poly1305|5|algorithm|declared crypto dependency (provides ChaCha20-Poly1305); not reached by the default build

[profile.release]
opt-level = 2
strip = true
