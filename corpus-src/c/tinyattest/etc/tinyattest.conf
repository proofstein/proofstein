# tinyattest device configuration.
#
# The helper builds its primitives from these names at startup; nothing is
# hard-coded in main.c.

transport = verifier-direct
verifier = attest.fleet.internal:9443

report_cipher = AES-256-GCM #@PS c-l4-conf-cipher|AES-256-GCM|4|algorithm|report AEAD selected by config
report_signature = Ed25519 #@PS c-l4-conf-sig|Ed25519|4|algorithm|report signature selected by config
key_agreement = ML-KEM-512 #@PS c-l4-conf-kem|ML-KEM-512|4|algorithm|verifier session key agreement selected by config
digest = SHA-256 #@PS c-l4-conf-digest|SHA-256|4|algorithm|report digest selected by config
record_seal = LMS_SHA256_M32_H10 #@PS c-l4-conf-record-seal|LMS|4|algorithm|record seal parameter set selected by config
archive_signature = falcon512 #@PS c-l4-conf-archive-sig|Falcon-512|4|algorithm|archive signature in the oqs-provider algorithm spelling

provisioning_key = keys/provisioning-key.pem
report_key = keys/report-signing-key.pem

max_report_bytes = 4096
retry_seconds = 30
