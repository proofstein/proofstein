# ledger-svc runtime settings.
#
# The crypto block decides what the service builds at startup; no algorithm is
# hard-coded in App.java.

ledger.node-name=lg-eu-central-1
ledger.listen=127.0.0.1:8710
ledger.store=sealed-memory
ledger.segment-bytes=1048576

ledger.crypto.segment-cipher=AES-256-GCM
ledger.crypto.block-signature=Ed25519
ledger.crypto.replication-key-agreement=ML-KEM-768
ledger.crypto.settlement-signature=SHA256withRSA
ledger.crypto.audit-seal=XMSS-SHA2_10_256
ledger.crypto.keystore=keys/ledger-node.p12

ledger.index.fingerprint-hash=SHA-256
ledger.index.retain-days=2555
