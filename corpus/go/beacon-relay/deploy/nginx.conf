# Edge terminator in front of the relay fleet.
#
# The relay itself speaks plain HTTP on the loopback interface; everything
# facing the devices is terminated here.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log /var/log/nginx/relay-access.log;

    server {
        listen 8443 ssl;
        server_name relay.beacon.internal;

        ssl_certificate     /etc/relay/tls/relay-cert.pem;
        ssl_certificate_key /etc/relay/tls/relay-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 10m;

        location /v1/beacons {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header X-Relay-Edge $hostname;
        }

        location /healthz {
            return 200 "ok\n";
        }
    }
}
